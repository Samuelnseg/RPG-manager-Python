# Copia este archivo como config.ini y pon tus datos.
# config.ini NO se sube a GitHub (está en .gitignore); este .example sí.

[app]
# memoria | mariadb | mongo  -> la única línea que cambias para cambiar de motor
repositorio = memoria

[mariadb]
host = localhost
puerto = 3306
base = rpg_manager
usuario = root
clave = TU_CLAVE

[mongo]
# Local: mongodb://localhost:27017
# Atlas: mongodb+srv://USUARIO:CLAVE@cluster0.xxxxx.mongodb.net
uri = mongodb://localhost:27017
base = rpg_manager