<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/personajes" method="POST">

        <label for="nombre">Nombre del personaje:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="clase">Clase del personaje:</label>
        <input type="text" id="clase" name="clase" required>

        <label for="nivel">Nivel del personaje:</label>
        <input type="number" id="nivel" name="nivel" required>

        <label for="vida">Vida del personaje:</label>
        <input type="number" id="vida" name="vida" required>

        <button type="submit">Registrar personaje</button>

    </form>

    <table>
        <thead>
            <tr>
                <th>nombre</th>
                <th>clase</th>
                <th>nivel</th>
                <th>vida</th>
            </tr>
        </thead>
        <tbody>
            {% for p in personajes %}
            <tr>
                <td>{{ p.nombre }}</td>
                <td>{{ p.clase }}</td>
                <td>{{ p.nivel }}</td>
                <td>{{ p.vida }}</td>   
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
