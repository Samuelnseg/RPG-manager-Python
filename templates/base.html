<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPG Manager · {% block titulo %}{% endblock %}</title>
  <!-- Bootstrap 5 desde CDN: solo da estilo, la lógica sigue en el Service -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('personajes.listar') }}">RPG Manager</a>
      <span class="badge rounded-pill text-bg-light">Repositorio: {{ motor }}</span>
    </div>
  </nav>
  <main class="container pb-5">
    {% block contenido %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
